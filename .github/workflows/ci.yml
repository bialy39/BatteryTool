name: Continuous Integration

on:
  push:
    branches:
      - main
      - android17
  pull_request:
    branches:
      - main

concurrency:
  group: ci-${{ github.ref }}
  cancel-in-progress: true

# Forks inherit read-only default token permissions, which makes the SARIF
# upload of ktlint/detekt fail even when the analysis itself passed.
permissions:
  contents: read
  security-events: write

jobs:
  ktlint:
    runs-on: ubuntu-24.04
    timeout-minutes: 5
    steps:
      - uses: actions/checkout@v7
      - name: Install
        run: |
          curl -sSLO https://github.com/pinterest/ktlint/releases/download/1.0.1/ktlint
          chmod a+x ktlint
          sudo mv ktlint /usr/local/bin/
      - name: Run
        run: ktlint --reporter sarif -l none > ktlint.sarif
      - name: Upload SARIF
        uses: github/codeql-action/upload-sarif@v4
        if: success() || failure()
        with:
          sarif_file: ktlint.sarif
  detekt:
    runs-on: ubuntu-24.04
    timeout-minutes: 5
    steps:
      - uses: actions/checkout@v7
      - name: Setup Java
        uses: actions/setup-java@v6
        with:
          distribution: temurin
          java-version: 17
      - name: Setup Gradle
        uses: gradle/actions/setup-gradle@v6
      - name: Run
        run: |
          chmod +x gradlew
          ./gradlew detekt
      - name: Upload SARIF
        uses: github/codeql-action/upload-sarif@v4
        if: success() || failure()
        with:
          sarif_file: app/build/reports/detekt/detekt.sarif
      - name: Job Summary
        if: success() || failure()
        run: cat ./app/build/reports/detekt/detekt.md >> $GITHUB_STEP_SUMMARY
  build:
    runs-on: ubuntu-24.04
    timeout-minutes: 10
    steps:
      - uses: actions/checkout@v7
      - name: Setup Java
        uses: actions/setup-java@v6
        with:
          distribution: temurin
          java-version: 17
      - name: Setup Gradle
        uses: gradle/actions/setup-gradle@v6
      - name: Run
        run: |
          chmod +x gradlew
          ./gradlew build
